name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release after all builds pass (true) or artifact only (false)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Evaluate Triggers
        id: check
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          SHOULD_BUILD=false
          SHOULD_PUBLISH=false

          # 提取 csproj 中的版本号
          CSPROJ_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/Dareu.LM113.App/Dareu.LM113.App.csproj || echo "1.0.0")

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHOULD_BUILD=true
            SHOULD_PUBLISH="$INPUT_PUBLISH"
            VERSION="$CSPROJ_VERSION"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" =~ ^v[0-9] ]]; then
            SHOULD_BUILD=true
            SHOULD_PUBLISH=true
            VERSION="${REF_NAME#v}"
          elif python scripts/ci/ci-trigger.py --message "$COMMIT_MSG" --token build-release; then
            SHOULD_BUILD=true
            SHOULD_PUBLISH=true
            VERSION="$CSPROJ_VERSION"
          elif python scripts/ci/ci-trigger.py --message "$COMMIT_MSG" --token build-artifact; then
            SHOULD_BUILD=true
            SHOULD_PUBLISH=false
            VERSION="$CSPROJ_VERSION"
          else
            echo "No CI trigger keyword found in commit message. Skipping build."
            VERSION="$CSPROJ_VERSION"
          fi

          TAG_NAME="v${VERSION}"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "Evaluated: build=$SHOULD_BUILD, publish=$SHOULD_PUBLISH, version=$VERSION, tag=$TAG_NAME"

  build-windows-linux:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: win-x64
            ext: .exe
          - os: windows-latest
            rid: win-arm64
            name: win-arm64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
            ext: ''
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            name: linux-arm64
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File App
        shell: bash
        run: |
          dotnet publish ./src/Dareu.LM113.App/Dareu.LM113.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./publish

      - name: Package Windows Artifacts
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          mkdir -p ./dist
          cd ./publish
          zip -r "../dist/Dareu-LM113-${{ matrix.name }}.zip" ./*

      - name: Package Linux Artifacts (tar.gz, deb, rpm)
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ./dist
          
          # 1. 基础 tar.gz 绿色便携包
          tar -czvf "./dist/Dareu-LM113-${{ matrix.name }}.tar.gz" -C ./publish .

          # 2. 构建 deb 与 rpm (仅在 linux-x64 通过 fpm 生成)
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then
            sudo apt-get update && sudo apt-get install -y ruby ruby-dev rubygems rpm
            sudo gem install --no-document fpm
            
            mkdir -p ./deb-root/usr/bin
            mkdir -p ./deb-root/etc/udev/rules.d
            mkdir -p ./deb-root/usr/share/applications
            mkdir -p ./deb-root/usr/share/pixmaps

            cp ./publish/Dareu.LM113.App ./deb-root/usr/bin/dareu-lm113
            chmod +x ./deb-root/usr/bin/dareu-lm113
            cp ./linux/99-dareu-mouse.rules ./deb-root/etc/udev/rules.d/
            cp ./linux/dareu-lm113.desktop ./deb-root/usr/share/applications/
            cp ./src/Dareu.LM113.App/Assets/mouse_main.png ./deb-root/usr/share/pixmaps/dareu-lm113.png
            
            fpm -s dir -t deb -n dareu-lm113 -v "$APP_VERSION" -a amd64 \
              -C ./deb-root \
              -p ./dist/dareu-lm113_${APP_VERSION}_amd64.deb \
              --description "DAREU LM113 Mouse Driver GUI"

            fpm -s dir -t rpm -n dareu-lm113 -v "$APP_VERSION" -a x86_64 \
              -C ./deb-root \
              -p ./dist/dareu-lm113-${APP_VERSION}-1.x86_64.rpm \
              --description "DAREU LM113 Mouse Driver GUI"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ./dist/*
          retention-days: 7

  build-macos:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            name: osx-arm64
          - os: macos-13
            rid: osx-x64
            name: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File App
        shell: bash
        run: |
          dotnet publish ./src/Dareu.LM113.App/Dareu.LM113.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./publish

      - name: Package macOS App
        shell: bash
        run: |
          mkdir -p ./dist
          tar -czvf "./dist/Dareu-LM113-${{ matrix.name }}.tar.gz" -C ./publish .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ./dist/*
          retention-days: 7

  create-release:
    name: Publish GitHub Release
    needs: [prepare, build-windows-linux, build-macos]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_publish == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten Artifact Files
        shell: bash
        run: |
          mkdir -p ./release-files
          find ./artifacts -type f -exec cp {} ./release-files/ \;
          ls -la ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: "DAREU LM113 Driver ${{ needs.prepare.outputs.tag_name }}"
          files: |
            ./release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
